<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eszközleltár</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="fejlec">
    <div>
      <h1>Eszközleltár</h1>
      <p>Iskolai eszközök nyilvántartása: mi hol van, és ki vitte el?</p>
    </div>
    <div class="fejlec-gombok">
      <button type="button" id="ujGomb">Új eszköz</button>
    </div>
  </header>

  <main>
    <section class="statisztika" id="statisztika" aria-label="Statisztika"></section>

    <section class="szuro" aria-label="Keresés és szűrés">
      <input type="search" id="kereses" placeholder="Keresés névre, azonosítóra vagy névre, akinél van">
      <select id="kategoriaSzuro" aria-label="Kategória"></select>
      <select id="allapotSzuro" aria-label="Állapot">
        <option value="">Minden állapot</option>
        <option value="elerheto">Elérhető</option>
        <option value="kiadva">Kiadva (kinél van)</option>
        <option value="lejart">Lejárt kölcsönzés</option>
        <option value="hibas">Hibás</option>
      </select>
    </section>

    <table>
      <thead>
        <tr>
          <th>Azonosító</th>
          <th>Név</th>
          <th>Kategória</th>
          <th>Állapot</th>
          <th>Kinél van</th>
          <th>Határidő</th>
          <th>Műveletek</th>
        </tr>
      </thead>
      <tbody id="tablaTest"></tbody>
    </table>
    <p id="uresUzenet" class="ures" hidden>Nincs találat. Szélesítsd a szűrést, vagy vegyél fel új eszközt.</p>
  </main>
